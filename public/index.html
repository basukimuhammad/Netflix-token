<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netflix Token Generator</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0d1117;color:#e6edf3;padding:24px 14px;display:flex;flex-direction:column;justify-content:center}
main{max-width:600px;margin:0 auto;width:100%}
.panel{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:23px;box-shadow:0 18px 55px #0005}
h1{font-size:22px;margin:0 0 10px}
p.muted{color:#8b949e;font-size:13px;line-height:1.6;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
textarea{width:100%;height:120px;padding:13px 14px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;outline:none;font-family:monospace;font-size:12px;resize:vertical}
textarea:focus{border-color:#2f81f7}
button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:19px;background:#238636;color:white;font-weight:800;font-size:14px;cursor:pointer;transition:0.2s}
button:hover{background:#2ea043}
button:disabled{opacity:.55;cursor:wait;background:#238636}
.status{display:none;margin-top:15px;padding:13px;border-radius:10px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.status.ok{display:block;background:#10251a;border:1px solid #238636}
.status.err{display:block;background:#2d1518;border:1px solid #da3633}
.result-box{background:#0d1117;border:1px solid #30363d;padding:12px;border-radius:8px;margin-top:10px;word-break:break-all}
.result-box a{color:#58a6ff;text-decoration:none;font-weight:bold}
.result-box a:hover{text-decoration:underline}
footer{color:#6e7681;text-align:center;font-size:11px;margin-top:20px;line-height:1.6}
footer a{color:#8b949e}
</style>
</head>
<body>
<main>
    <section class="panel">
        <h1>🍿 Netflix Token Generator</h1>
        <p class="muted">Masukkan Cookie Netflix kamu (format Netscape, JSON, atau raw string seperti <code>NetflixId=...</code>) di bawah ini untuk mengekstrak token login.</p>

        <label for="cookieInput">Cookie Netflix</label>
        <textarea id="cookieInput" placeholder="NetflixId=...; SecureNetflixId=...; nfvdid=..."></textarea>

        <button id="generateBtn">EKSTRAK TOKEN</button>

        <div class="status" id="status"></div>
    </section>

    <footer>
        Original Script by <a href="https://github.com/harshitkamboj" target="_blank">harshitkamboj</a><br>
        website: harshitkamboj.in | discord: https://discord.gg/DYJFE9nu5X
    </footer>
</main>

<script>
const btn = document.getElementById('generateBtn');
const input = document.getElementById('cookieInput');
const statusBox = document.getElementById('status');

btn.addEventListener('click', async () => {
    const rawCookie = input.value.trim();
    if (!rawCookie) {
        showStatus('Silakan masukkan cookie terlebih dahulu.', 'err');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'MEMPROSES...';
    showStatus('Menghubungi API Netflix...', 'info');

    try {
        const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rawCookie })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Terjadi kesalahan sistem.');
        }

        // Tampilkan hasil sukses
        statusBox.className = 'status ok';
        statusBox.innerHTML = `
            <strong>Berhasil!</strong><br>
            Expires: ${data.expires}
            <div class="result-box">
                <a href="${data.url}" target="_blank">${data.url}</a>
            </div>
        `;

    } catch (error) {
        showStatus(error.message, 'err');
    } finally {
        btn.disabled = false;
        btn.textContent = 'EKSTRAK TOKEN';
    }
});

function showStatus(msg, type) {
    statusBox.className = 'status ' + type;
    statusBox.textContent = msg;
}
</script>
</body>
</html>
