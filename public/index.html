<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Cookie Parser — Web Tool</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      display: grid; place-items: center;
      background: radial-gradient(circle at top, #292020, #101010 55%);
      color: #f5f5f5; font-family: system-ui, Arial, sans-serif;
    }
    .card {
      width: min(100%, 520px); padding: 26px;
      background: #191919; border: 1px solid #353535;
      border-radius: 20px; box-shadow: 0 18px 60px #0008;
    }
    .brand { color: #e50914; font-size: 13px; font-weight: 800; letter-spacing: 3px; }
    h1 { margin: 8px 0 6px; font-size: 25px; }
    .muted { color: #aaa; font-size: 13px; line-height: 1.6; }
    label { display: block; margin: 22px 0 8px; font-size: 13px; font-weight: 650; }
    textarea {
      width: 100%; min-height: 155px; resize: vertical; padding: 14px;
      color: #fff; background: #101010; border: 1px solid #444;
      border-radius: 12px; outline: none; font: 13px/1.5 ui-monospace, monospace;
    }
    textarea:focus { border-color: #e50914; }
    button {
      width: 100%; border: 0; border-radius: 11px; padding: 14px;
      margin-top: 12px; color: white; background: #e50914;
      font-weight: 750; cursor: pointer;
    }
    button.secondary { background: #333; }
    button:disabled { opacity: .6; cursor: wait; }
    .result, .error {
      display: none; margin-top: 18px; padding: 14px;
      border-radius: 12px; font-size: 13px; overflow-wrap: anywhere;
    }
    .result { background: #12301f; border: 1px solid #245b39; }
    .error { background: #351719; border: 1px solid #713035; color: #ffb8bc; }
    .result strong { color: #8ff0ad; }
    .privacy { margin-top: 18px; padding-top: 14px; border-top: 1px solid #333; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">WEB TOOL</div>
    <h1>Cookie Parser</h1>
    <div class="muted">Parser format cookie untuk penggunaan dan pengujian yang sah.</div>

    <label for="cookie">Masukkan cookie</label>
    <textarea id="cookie" autocomplete="off" autocapitalize="off"
      spellcheck="false" placeholder="NetflixId=...; SecureNetflixId=..."></textarea>

    <button id="parseBtn" type="button">VALIDATE COOKIE</button>
    <button class="secondary" id="clearBtn" type="button">CLEAR INPUT</button>

    <div class="error" id="error" role="alert"></div>
    <section class="result" id="result" aria-live="polite">
      <strong>✓ Cookie berhasil dibaca</strong>
      <p id="count"></p>
      <p id="keys"></p>
    </section>

    <div class="muted privacy">
      Privasi: aplikasi ini hanya memeriksa nama cookie, tidak menampilkan atau
      menyimpan nilainya. Jangan masukkan cookie akun yang bukan milikmu.
    </div>
  </main>

  <script>
    const input = document.getElementById("cookie");
    const button = document.getElementById("parseBtn");
    const errorBox = document.getElementById("error");
    const resultBox = document.getElementById("result");

    button.addEventListener("click", async () => {
      errorBox.style.display = "none";
      resultBox.style.display = "none";
      button.disabled = true;
      button.textContent = "MEMERIKSA...";

      try {
        const response = await fetch("/api/parse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ cookie: input.value })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Permintaan gagal.");

        document.getElementById("count").textContent =
          "Cookie dikenali: " + data.count;
        document.getElementById("keys").textContent =
          "Nama cookie: " + data.cookies.join(", ");
        resultBox.style.display = "block";
      } catch (error) {
        errorBox.textContent = "✕ " + error.message;
        errorBox.style.display = "block";
      } finally {
        button.disabled = false;
        button.textContent = "VALIDATE COOKIE";
      }
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      input.value = "";
      errorBox.style.display = "none";
      resultBox.style.display = "none";
    });
  </script>
</body>
</html>
